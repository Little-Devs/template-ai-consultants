<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lorem Ipsum Dolor Sit Amet Consectetur Adipiscing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --base:#0E1117; --surface:#21252F; --surface-2:#262B36; --ivory:#FDFAF7;
  --muted:rgba(253,250,247,0.6); --faint:rgba(253,250,247,0.34);
  --hair:rgba(253,250,247,0.10); --hair-strong:rgba(253,250,247,0.18);
  --grid:rgba(253,250,247,0.04);
  --terra:#CF5430; --terra-deep:#B84020; --terra-soft:#E07A50; --hot:#FF6A38;
  --f-display:'Cormorant Garamond',Georgia,serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;}
body{overflow:hidden;color:var(--ivory);font-family:var(--f-body);}
.frame{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
.stage{
  position:relative;width:1080px;height:1350px;flex:0 0 auto;
  transform:scale(var(--s,1));transform-origin:center center;overflow:hidden;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(72% 46% at 50% 44%,rgba(207,84,48,0.11),transparent 60%),
    var(--base);
  background-size:60px 60px,60px 60px,100% 100%,100% 100%;
}

/* chrome */
.ch{position:absolute;font-family:var(--f-mono);font-size:21px;letter-spacing:.24em;text-transform:uppercase;z-index:7;}
.ch.tl{top:60px;left:72px;color:var(--faint);}
.ch.tl b{color:var(--terra);font-weight:500;}
.ch.tr{top:60px;right:72px;color:var(--muted);}
.ch.bc{bottom:60px;left:0;width:100%;text-align:center;color:var(--faint);font-size:18px;letter-spacing:.3em;}

/* sweep line (loop bookend: down = reveal, up = clear) */
.sweep{position:absolute;left:40px;width:1000px;height:3px;top:0;z-index:6;opacity:0;
  background:linear-gradient(90deg,transparent,var(--hot),transparent);box-shadow:0 0 26px 2px rgba(255,106,56,0.55);}
#content{position:absolute;inset:0;}

/* the scattered tools that collapse into one system */
.tool{position:absolute;width:140px;height:56px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--hair-strong);border-radius:12px;
  font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ivory);z-index:4;opacity:0;}
.tool.t0{left:110px;top:330px;} .tool.t1{left:830px;top:330px;}
.tool.t2{left:90px;top:600px;}  .tool.t3{left:850px;top:600px;}
.tool.t4{left:470px;top:250px;}
.tool.t5{left:90px;top:860px;}  .tool.t6{left:850px;top:860px;}
.tool.t7{left:280px;top:990px;} .tool.t8{left:660px;top:990px;}

/* the secure boundary + the Aria core inside it */
.vault{position:absolute;inset:0;z-index:3;}
.lock{position:absolute;left:508px;top:356px;width:64px;height:50px;display:grid;place-items:center;background:var(--base);z-index:4;opacity:0;}
.lock svg{width:32px;height:32px;}
.node{position:absolute;left:410px;top:470px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,rgba(207,84,48,0.22),rgba(207,84,48,0.04));
  border:2px solid var(--terra);display:grid;place-items:center;z-index:5;}
.node .mc{font-family:var(--f-display);font-weight:500;font-size:64px;line-height:1;color:var(--terra-soft);}
.ring{position:absolute;left:410px;top:470px;width:260px;height:260px;border-radius:50%;border:1.5px solid var(--hot);z-index:4;opacity:0;pointer-events:none;}
.nsub{position:absolute;left:0;top:750px;width:100%;text-align:center;font-family:var(--f-mono);font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:6;}

/* the infrastructure spec, at the four corners of the contained square */
.spec{position:absolute;width:260px;text-align:center;z-index:5;opacity:0;}
.spec.tl{left:30px;top:248px;} .spec.tr{left:790px;top:248px;}
.spec.bl{left:30px;top:892px;} .spec.br{left:790px;top:892px;}
.spec .ic{display:block;margin:0 auto 14px;width:38px;height:38px;}
.spec .ic svg{width:38px;height:38px;display:block;}
.spec .l{font-family:var(--f-mono);font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:var(--ivory);white-space:nowrap;}

/* headline */
.headline{position:absolute;bottom:116px;left:0;width:100%;text-align:center;z-index:6;opacity:0;}
.headline .tag{font-family:var(--f-mono);font-size:18px;letter-spacing:.26em;text-transform:uppercase;color:var(--terra);margin-bottom:18px;}
.headline .t{font-family:var(--f-mono);font-weight:500;font-size:46px;letter-spacing:.05em;text-transform:uppercase;color:var(--ivory);line-height:1.16;}
</style>
</head>
<body>
<div class="frame"><div class="stage" id="stage">

  <div class="ch tl"><b>lorem</b> STUDIO</div>
  <div class="ch tr">lorem ipsum dolor sit</div>
  <div class="ch bc">lorem ipsum dolor sit amet</div>

  <div class="sweep" id="sweep"></div>

  <div id="content">

    <!-- the dozen apps you juggle -->
    <div class="tool t0" id="tool0">lorem</div>
    <div class="tool t1" id="tool1">lorem</div>
    <div class="tool t2" id="tool2">lorem</div>
    <div class="tool t3" id="tool3">lorem</div>
    <div class="tool t4" id="tool4">lorem</div>
    <div class="tool t5" id="tool5">lorem ipsum</div>
    <div class="tool t6" id="tool6">lorem</div>
    <div class="tool t7" id="tool7">lorem</div>
    <div class="tool t8" id="tool8">lorem</div>

    <!-- the secure boundary, drawn around the core -->
    <svg class="vault" id="vaultsvg" viewbox="0 0 1080 1350" fill="none">
      <path id="cn0" d="M333 393 L208 305" stroke="#CF5430" stroke-width="1.5" opacity="0.4"/>
      <path id="cn1" d="M747 393 L872 305" stroke="#CF5430" stroke-width="1.5" opacity="0.4"/>
      <path id="cn2" d="M333 807 L208 900" stroke="#CF5430" stroke-width="1.5" opacity="0.4"/>
      <path id="cn3" d="M747 807 L872 900" stroke="#CF5430" stroke-width="1.5" opacity="0.4"/>
      <path id="vault" d="M350 380 H730 A30 30 0 0 1 760 410 V790 A30 30 0 0 1 730 820 H350 A30 30 0 0 1 320 790 V410 A30 30 0 0 1 350 380 Z" stroke="#CF5430" stroke-width="2"/>
    </svg>
    <div class="lock" id="lock"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>

    <span class="ring" id="ring1"></span>
    <div class="node" id="node"><span class="mc" id="mcore">Aria</span></div>
    <div class="nsub" id="nsub">lorem ipsum</div>

    <!-- the infrastructure spec, one property at each corner -->
    <div class="spec tl" id="tg0"><span class="ic"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></svg></span><span class="l" id="tgl0">lorem</span></div>
    <div class="spec tr" id="tg1"><span class="ic"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span><span class="l" id="tgl1">lorem &amp; lorem</span></div>
    <div class="spec bl" id="tg2"><span class="ic"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></span><span class="l" id="tgl2">lorem ipsum</span></div>
    <div class="spec br" id="tg3"><span class="ic"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 8.5-4-1-7-4-7-8.5V6z"/><path d="M9 11.5l2 2 4-4"/></svg></span><span class="l" id="tgl3">lorem &amp; lorem</span></div>

    <div class="headline" id="hl">
      <div class="tag" id="hltag">lorem ipsum dolor</div>
      <div class="t" id="hl1">lorem ipsum dolor</div>
      <div class="t" id="hl2">lorem ipsum</div>
    </div>

  </div><!-- /#content -->

</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
<script>
(function(){
  'use strict';
  var root=document.documentElement;
  function scale(){ root.style.setProperty('--s', Math.min(innerWidth/1080, innerHeight/1350).toFixed(4)); }
  scale(); addEventListener('resize',scale);
  gsap.registerPlugin(DrawSVGPlugin, ScrambleTextPlugin, TextPlugin);

  // scattered tools -> their fly-in delta to the core centre (540,600)
  var TOOLS=[{sel:'#tool0',dx:360,dy:242},{sel:'#tool1',dx:-360,dy:242},
             {sel:'#tool2',dx:380,dy:-28},{sel:'#tool3',dx:-380,dy:-28},
             {sel:'#tool4',dx:0,dy:322},
             {sel:'#tool5',dx:380,dy:-288},{sel:'#tool6',dx:-380,dy:-288},
             {sel:'#tool7',dx:190,dy:-418},{sel:'#tool8',dx:-190,dy:-418}];
  var TAGS=[{box:'#tg0',lab:'#tgl0',cn:'#cn0'},{box:'#tg1',lab:'#tgl1',cn:'#cn1'},
            {box:'#tg2',lab:'#tgl2',cn:'#cn2'},{box:'#tg3',lab:'#tgl3',cn:'#cn3'}];
  // mono single-line runs that digitise away (constant width => no reflow).
  // "Aria" (Cormorant) and the tool tiles just fade.
  var AWAY=['#nsub','#tgl0','#tgl1','#tgl2','#tgl3','#hltag','#hl1','#hl2'];
  var ORIG=AWAY.map(function(s){ var el=document.querySelector(s); return el?el.textContent:''; });
  var NOISE=ORIG.map(function(t){ var C='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', o='';
    for(var i=0;i<t.length;i++){ o+= /\s/.test(t[i]) ? ' ' : C[(Math.random()*C.length)|0]; } return o; });

  /* ========================================================================
     SHARED LOOP ENGINE  —  identical in every Aria slide. One seekable master
     timeline (repeat:-1): autoplays in-browser AND renders frame-perfect to MP4
     via render.mjs (which seeks window.__MARIA__.tl).
     ======================================================================== */
  function revealIn(tl){
    tl.to('#sweep',{opacity:1,duration:.3,ease:'power2.out'},0);
    tl.to('#sweep',{top:1340,duration:1.7,ease:'power1.inOut'},0);
    tl.to('#sweep',{opacity:0,duration:.45,ease:'power1.in'},1.35);
    revealHero(tl);
  }
  function clearOut(tl){
    tl.set('#sweep',{top:1320,opacity:0})
      .to('#sweep',{opacity:1,duration:.3,ease:'power2.out'},'<')
      .to('#sweep',{top:60,duration:1.3,ease:'power1.inOut'},'<')
      .to('#content',{opacity:0,duration:.95,ease:'none'},'<+0.2');
    AWAY.forEach(function(sel,i){
      tl.to(sel,{scrambleText:{text:NOISE[i],chars:'upperCase',speed:2.4},duration:.95,ease:'none'},'<');
    });
    tl.to('#sweep',{opacity:0,duration:.3,ease:'power1.in'},'>-0.25');
  }
  var DECCH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function decodeAll(tl, sel, finalText, dur, pos){
    var el=document.querySelector(sel), n=finalText.length, thr=[];
    for(var i=0;i<n;i++){ thr.push(/\s/.test(finalText[i]) ? -1 : (0.55+Math.random()*0.4)); }
    var st={p:0};
    tl.to(st,{p:1,duration:dur,ease:'none',onUpdate:function(){
      var p=st.p, out='';
      for(var i=0;i<n;i++){ var c=finalText[i]; out += /\s/.test(c) ? ' ' : (p>=thr[i] ? c : DECCH[(Math.random()*DECCH.length)|0]); }
      el.textContent=out;
    }}, pos);
  }

  /* ========================================================================
     SLIDE 02 · THE HARNESS  —  her infrastructure (no hats, no task examples).
     ======================================================================== */
  // HERO: the Aria core (the harness / the engine the workforce runs on)
  function revealHero(tl){
    tl.fromTo('#node',{opacity:0,scale:.85},{opacity:1,scale:1,duration:.6,ease:'power3.out',immediateRender:false},0.66);
    tl.to('#mcore',{opacity:1,duration:.3,ease:'power2.out'},0.74);
    tl.to('#mcore',{scrambleText:{text:'Aria',chars:'upperCase',speed:1},duration:.55,ease:'none'},0.74);
    tl.to('#mcore',{color:'#FDFAF7',duration:.6,ease:'power1.out'},0.92);
    tl.to('#nsub',{opacity:1,duration:.45,ease:'power3.out'},1.06);
    tl.to('#nsub',{scrambleText:{text:'{original}',chars:'upperCase',speed:1},duration:.5,ease:'none'},1.06);
    tl.to({},{duration:0.6});
  }

  // BODY: a dozen tools collapse into one core -> a secure boundary seals
  // around it -> the infrastructure spec stamps in at the four corners.
  function body(tl){
    // 1. the scattered tools you juggle appear
    TOOLS.forEach(function(t,i){
      tl.fromTo(t.sel,{opacity:0,scale:.9},{opacity:1,scale:1,duration:.4,ease:'power3.out',immediateRender:false}, i===0?'+=0.1':'-=0.28');
    });
    // 2. hold so all the tools read, then they collapse INTO the single core
    tl.addLabel('collapse','+=3.0');
    TOOLS.forEach(function(t,i){
      tl.to(t.sel,{x:t.dx,y:t.dy,scale:.15,opacity:0,duration:.6,ease:'power2.in'},'collapse+='+(i*0.06).toFixed(2));
    });
    tl.fromTo('#ring1',{scale:1,opacity:.55},{scale:2.2,opacity:0,duration:.9,ease:'power2.out',immediateRender:false},'collapse+=0.5');
    tl.to('#node',{scale:1.07,duration:.3,ease:'power2.out'},'collapse+=0.55').to('#node',{scale:1,duration:.5,ease:'power2.out'});

    // 3. a secure boundary seals around the core (the signature)
    tl.to('#vault',{drawSVG:'100%',duration:1.0,ease:'power2.inOut'},'-=0.4');
    tl.fromTo('#vault',{stroke:'#FF6A38'},{stroke:'#CF5430',duration:.7,ease:'power2.out'},'>-0.2');
    tl.fromTo('#lock',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:'power3.out',immediateRender:false},'<');

    // 4. the infrastructure spec stamps in at the four corners
    TAGS.forEach(function(t,i){
      var p = i===0 ? '+=0.05' : '-=0.14';
      tl.to(t.cn,{drawSVG:'100%',duration:.4,ease:'power2.out'},p);
      tl.fromTo(t.box,{opacity:0,scale:.85,y:6},{opacity:1,scale:1,y:0,duration:.5,ease:'power3.out',immediateRender:false},'<');
      tl.to(t.lab,{scrambleText:{text:'{original}',chars:'upperCase',speed:.8},duration:.5,ease:'none'},'<');
    });

    // 5. headline decodes in, then hold
    tl.to('#hl',{opacity:1,duration:.3},'+=0.2')
      .fromTo('#hltag',{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:'power3.out',immediateRender:false},'<');
    decodeAll(tl,'#hl1',ORIG[AWAY.indexOf('#hl1')],1.0,'<');
    decodeAll(tl,'#hl2',ORIG[AWAY.indexOf('#hl2')],1.0,'<+0.18');
    tl.to({},{duration:6.2});
  }

  /* ---- start state (position 0; re-established every repeat) ---- */
  function setStart(tl){
    tl.set('#content',{opacity:1},0);
    tl.set('#sweep',{top:90,opacity:0},0);
    TOOLS.forEach(function(t){ tl.set(t.sel,{opacity:0,scale:.9,x:0,y:0},0); });
    tl.set('#vault',{drawSVG:'0%',stroke:'#CF5430'},0);
    tl.set('#lock',{opacity:0,scale:.6},0);
    tl.set('#node',{opacity:0,scale:.85},0);
    tl.set('#mcore',{opacity:0,color:'#E07A50'},0);
    tl.set('#nsub',{opacity:0},0);
    tl.set('#ring1',{opacity:0,scale:1},0);
    TAGS.forEach(function(t){ tl.set(t.box,{opacity:0,scale:.85,y:6},0); tl.set(t.cn,{drawSVG:'0%'},0); });
    tl.set('#hl',{opacity:0},0);
    tl.set('#hltag',{opacity:0,y:10},0);
    tl.set(['#hl1','#hl2'],{opacity:1},0);
    AWAY.forEach(function(s,i){ tl.set(s,{text:ORIG[i]},0); });
  }

  /* ---- build the single master loop + expose it for the renderer ---- */
  function build(){
    var tl=gsap.timeline();
    setStart(tl);
    revealIn(tl);
    body(tl);
    clearOut(tl);
    return tl;
  }
  var master=build();
  master.repeat(-1).repeatDelay(0.35);
  window.__MARIA__={ tl:master, cycle:master.duration() };
  master.play(0);
})();
</script>
</body>
</html>
