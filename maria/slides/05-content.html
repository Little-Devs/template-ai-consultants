<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lorem Ipsum Dolor Sit Amet Consectetur Adipiscing Elit Sed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --base:#0E1117; --surface:#21252F; --surface-2:#262B36; --ivory:#FDFAF7;
  --muted:rgba(253,250,247,0.6); --faint:rgba(253,250,247,0.34);
  --hair:rgba(253,250,247,0.10); --hair-strong:rgba(253,250,247,0.18);
  --grid:rgba(253,250,247,0.04);
  --terra:#CF5430; --terra-deep:#B84020; --terra-soft:#E07A50; --hot:#FF6A38;
  --f-display:'Cormorant Garamond',Georgia,serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;}
body{overflow:hidden;color:var(--ivory);font-family:var(--f-body);}
.frame{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
.stage{
  position:relative;width:1080px;height:1350px;flex:0 0 auto;
  transform:scale(var(--s,1));transform-origin:center center;overflow:hidden;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(70% 40% at 50% 30%,rgba(207,84,48,0.10),transparent 60%),
    var(--base);
  background-size:60px 60px,60px 60px,100% 100%,100% 100%;
}

/* chrome */
.ch{position:absolute;font-family:var(--f-mono);font-size:21px;letter-spacing:.24em;text-transform:uppercase;z-index:7;}
.ch.tl{top:60px;left:72px;color:var(--faint);}
.ch.tl b{color:var(--terra);font-weight:500;}
.ch.tr{top:60px;right:72px;color:var(--muted);}
.ch.bc{bottom:60px;left:0;width:100%;text-align:center;color:var(--faint);font-size:18px;letter-spacing:.3em;}

/* sweep line */
.sweep{position:absolute;left:40px;width:1000px;height:3px;top:0;z-index:6;opacity:0;
  background:linear-gradient(90deg,transparent,var(--hot),transparent);box-shadow:0 0 26px 2px rgba(255,106,56,0.55);}
#content{position:absolute;inset:0;}

/* hero name + chip */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;}
.heroname{font-family:var(--f-display);font-weight:400;font-size:172px;line-height:1;color:var(--terra-soft);opacity:0;}
.herosub{font-family:var(--f-mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--terra);margin-top:30px;opacity:0;}
.core{position:absolute;top:150px;left:50%;transform:translateX(-50%);border:1px solid var(--terra);
  padding:16px 46px;background:linear-gradient(180deg,rgba(207,84,48,0.15),rgba(207,84,48,0.03));text-align:center;opacity:0;z-index:5;}
.core .cl{font-family:var(--f-display);font-weight:500;font-size:48px;line-height:.9;color:var(--terra-soft);}
.core .cs{font-family:var(--f-mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:rgba(253,250,247,0.92);margin-top:5px;}

/* the one idea (spark) */
.fan{position:absolute;inset:0;z-index:2;}
.spark{position:absolute;left:492px;top:332px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(255,106,56,0.5),rgba(207,84,48,0.08));
  border:2px solid var(--terra);display:grid;place-items:center;z-index:5;opacity:0;}
.spark svg{width:46px;height:46px;}
.sparkring{position:absolute;left:492px;top:332px;width:96px;height:96px;border-radius:50%;border:1.5px solid var(--hot);z-index:4;opacity:0;pointer-events:none;}

/* research -> generate -> post status, and the sources she pulls from */
.status{position:absolute;top:446px;left:0;width:100%;text-align:center;font-family:var(--f-mono);font-size:22px;letter-spacing:.26em;text-transform:uppercase;color:var(--ivory);z-index:6;opacity:0;}
.rpill{position:absolute;top:524px;width:150px;height:50px;display:grid;place-items:center;border-radius:25px;
  background:var(--surface);border:1px solid var(--hair-strong);font-family:var(--f-mono);font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ivory);z-index:4;opacity:0;}
.rpill.p0{left:195px;} .rpill.p1{left:375px;} .rpill.p2{left:555px;} .rpill.p3{left:735px;}

/* the week strip */
.day{position:absolute;top:606px;width:170px;text-align:center;font-family:var(--f-mono);font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);z-index:5;opacity:0;}
.day.d0{left:75px;} .day.d1{left:265px;} .day.d2{left:455px;} .day.d3{left:645px;} .day.d4{left:835px;}
.slot{position:absolute;top:670px;width:156px;height:120px;border-radius:14px;border:1px dashed var(--hair-strong);z-index:3;opacity:0;}
.slot.s0{left:82px;} .slot.s1{left:272px;} .slot.s2{left:462px;} .slot.s3{left:652px;} .slot.s4{left:842px;}

/* the content pieces that fill the week */
.ctile{position:absolute;top:670px;width:156px;height:120px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--surface);border:1px solid var(--hair-strong);z-index:5;opacity:0;}
.ctile.c0{left:82px;} .ctile.c1{left:272px;} .ctile.c2{left:462px;} .ctile.c3{left:652px;} .ctile.c4{left:842px;}
.ctile .cg{width:34px;height:34px;}
.ctile .cg svg{width:34px;height:34px;display:block;}
.ctile .ct{font-family:var(--f-mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--ivory);white-space:nowrap;}

/* headline */
.headline{position:absolute;bottom:116px;left:0;width:100%;text-align:center;z-index:6;opacity:0;}
.headline .tag{font-family:var(--f-mono);font-size:18px;letter-spacing:.26em;text-transform:uppercase;color:var(--terra);margin-bottom:18px;}
.headline .t{font-family:var(--f-mono);font-weight:500;font-size:46px;letter-spacing:.05em;text-transform:uppercase;color:var(--ivory);line-height:1.16;}
</style>
</head>
<body>
<div class="frame"><div class="stage" id="stage">

  <div class="ch tl"><b>lorem</b> STUDIO</div>
  <div class="ch tr">lorem ipsum dolor sit amet</div>
  <div class="ch bc">lorem ipsum dolor sit amet</div>

  <div class="sweep" id="sweep"></div>

  <div id="content">

    <div class="title" id="title"><div class="heroname" id="heroname">lorem</div><div class="herosub" id="herosub">lorem ipsum dolor</div></div>
    <div class="core" id="core"><div class="cl">lorem</div><div class="cs">lorem ipsum dolor sit</div></div>

    <!-- fan-out connectors -->
    <svg class="fan" id="fansvg" viewbox="0 0 1080 1350" fill="none">
      <path id="fan0" d="M540 428 L160 670" stroke="#CF5430" stroke-width="1.5" opacity="0.34"/>
      <path id="fan1" d="M540 428 L350 670" stroke="#CF5430" stroke-width="1.5" opacity="0.34"/>
      <path id="fan2" d="M540 428 L540 670" stroke="#CF5430" stroke-width="1.5" opacity="0.34"/>
      <path id="fan3" d="M540 428 L730 670" stroke="#CF5430" stroke-width="1.5" opacity="0.34"/>
      <path id="fan4" d="M540 428 L920 670" stroke="#CF5430" stroke-width="1.5" opacity="0.34"/>
    </svg>

    <!-- the one idea -->
    <span class="sparkring" id="sparkring"></span>
    <div class="spark" id="spark"><svg viewbox="0 0 24 24" fill="none" stroke="#FDFAF7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 2a6 6 0 0 0-4 10c.7.7 1 1.3 1 2h6c0-.7.3-1.3 1-2a6 6 0 0 0-4-10z"/></svg></div>
    <div class="status" id="status">lorem</div>

    <!-- research sources she pulls from (flow up into the spark) -->
    <div class="rpill p0" id="rp0"><span id="rl0">lorem</span></div>
    <div class="rpill p1" id="rp1"><span id="rl1">lorem</span></div>
    <div class="rpill p2" id="rp2"><span id="rl2">lorem ipsum</span></div>
    <div class="rpill p3" id="rp3"><span id="rl3">lorem</span></div>

    <!-- the week -->
    <div class="day d0" id="day0">lorem</div>
    <div class="day d1" id="day1">lorem</div>
    <div class="day d2" id="day2">lorem</div>
    <div class="day d3" id="day3">lorem</div>
    <div class="day d4" id="day4">lorem</div>
    <div class="slot s0" id="slot0"></div><div class="slot s1" id="slot1"></div><div class="slot s2" id="slot2"></div><div class="slot s3" id="slot3"></div><div class="slot s4" id="slot4"></div>

    <!-- the content pieces -->
    <div class="ctile c0" id="c0"><span class="cg"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 16l4.5-4 3.5 3 3-3.5L20 16"/></svg></span><span class="ct" id="ct0">lorem</span></div>
    <div class="ctile c1" id="c1"><span class="cg"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7.5l9 6 9-6"/></svg></span><span class="ct" id="ct1">lorem</span></div>
    <div class="ctile c2" id="c2"><span class="cg"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="12" height="12" rx="2"/><path d="M4 8v10a2 2 0 0 0 2 2h10"/></svg></span><span class="ct" id="ct2">lorem</span></div>
    <div class="ctile c3" id="c3"><span class="cg"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg></span><span class="ct" id="ct3">lorem</span></div>
    <div class="ctile c4" id="c4"><span class="cg"><svg viewbox="0 0 24 24" fill="none" stroke="#E07A50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3.4 2.6"/><circle cx="12" cy="12" r="3.5"/></svg></span><span class="ct" id="ct4">lorem</span></div>

    <div class="headline" id="hl">
      <div class="tag" id="hltag">lorem ipsum dolor sit</div>
      <div class="t" id="hl1">lorem ipsum</div>
      <div class="t" id="hl2">lorem ipsum dolor sit</div>
    </div>

  </div><!-- /#content -->

</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
<script>
(function(){
  'use strict';
  var root=document.documentElement;
  function scale(){ root.style.setProperty('--s', Math.min(innerWidth/1080, innerHeight/1350).toFixed(4)); }
  scale(); addEventListener('resize',scale);
  gsap.registerPlugin(DrawSVGPlugin, ScrambleTextPlugin, TextPlugin);

  var DAYS=[{lab:'#day0',slot:'#slot0'},{lab:'#day1',slot:'#slot1'},{lab:'#day2',slot:'#slot2'},
            {lab:'#day3',slot:'#slot3'},{lab:'#day4',slot:'#slot4'}];
  // content piece -> fly-in delta from the spark centre (540,380) to its slot
  var TILES=[{box:'#c0',lab:'#ct0',fan:'#fan0',fx:380,fy:-350},{box:'#c1',lab:'#ct1',fan:'#fan1',fx:190,fy:-350},
             {box:'#c2',lab:'#ct2',fan:'#fan2',fx:0,fy:-350},{box:'#c3',lab:'#ct3',fan:'#fan3',fx:-190,fy:-350},
             {box:'#c4',lab:'#ct4',fan:'#fan4',fx:-380,fy:-350}];
  // research sources -> fly-in delta UP into the spark centre (540,380)
  var RESEARCH=[{box:'#rp0',lab:'#rl0',dx:270,dy:-169},{box:'#rp1',lab:'#rl1',dx:90,dy:-169},
                {box:'#rp2',lab:'#rl2',dx:-90,dy:-169},{box:'#rp3',lab:'#rl3',dx:-270,dy:-169}];
  // mono single-line runs that digitise away. the Cormorant name (Vera) + glyphs fade.
  var AWAY=['#core .cs','#status','#day0','#day1','#day2','#day3','#day4',
            '#ct0','#ct1','#ct2','#ct3','#ct4','#hltag','#hl1','#hl2'];
  var ORIG=AWAY.map(function(s){ var el=document.querySelector(s); return el?el.textContent:''; });
  var NOISE=ORIG.map(function(t){ var C='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', o='';
    for(var i=0;i<t.length;i++){ o+= /\s/.test(t[i]) ? ' ' : C[(Math.random()*C.length)|0]; } return o; });

  /* ===== SHARED LOOP ENGINE (identical in every Aria slide) ===== */
  function revealIn(tl){
    tl.to('#sweep',{opacity:1,duration:.3,ease:'power2.out'},0);
    tl.to('#sweep',{top:1340,duration:1.7,ease:'power1.inOut'},0);
    tl.to('#sweep',{opacity:0,duration:.45,ease:'power1.in'},1.35);
    revealHero(tl);
  }
  function clearOut(tl){
    tl.set('#sweep',{top:1320,opacity:0})
      .to('#sweep',{opacity:1,duration:.3,ease:'power2.out'},'<')
      .to('#sweep',{top:60,duration:1.3,ease:'power1.inOut'},'<')
      .to('#content',{opacity:0,duration:.95,ease:'none'},'<+0.2');
    AWAY.forEach(function(sel,i){
      tl.to(sel,{scrambleText:{text:NOISE[i],chars:'upperCase',speed:2.4},duration:.95,ease:'none'},'<');
    });
    tl.to('#sweep',{opacity:0,duration:.3,ease:'power1.in'},'>-0.25');
  }
  var DECCH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  function decodeAll(tl, sel, finalText, dur, pos){
    var el=document.querySelector(sel), n=finalText.length, thr=[];
    for(var i=0;i<n;i++){ thr.push(/\s/.test(finalText[i]) ? -1 : (0.55+Math.random()*0.4)); }
    var st={p:0};
    tl.to(st,{p:1,duration:dur,ease:'none',onUpdate:function(){
      var p=st.p, out='';
      for(var i=0;i<n;i++){ var c=finalText[i]; out += /\s/.test(c) ? ' ' : (p>=thr[i] ? c : DECCH[(Math.random()*DECCH.length)|0]); }
      el.textContent=out;
    }}, pos);
  }

  /* ===== SLIDE 05 · VERA, HEAD OF MARKETING ===== */
  // HERO: the name "Vera" decodes (terra -> white)
  function revealHero(tl){
    tl.to('#heroname',{opacity:1,duration:.3,ease:'power2.out'},0.66);
    tl.to('#heroname',{scrambleText:{text:'VERA',chars:'upperCase',speed:1},duration:.7,ease:'none'},0.66);
    tl.to('#heroname',{color:'#FDFAF7',duration:.7,ease:'power1.out'},0.92);
    tl.to('#herosub',{opacity:1,duration:.5,ease:'power2.out'},0.8);
    tl.to('#herosub',{scrambleText:{text:'{original}',chars:'upperCase',speed:1},duration:.6,ease:'none'},0.8);
    tl.to({},{duration:1.2});
  }

  // BODY: name -> chip -> she RESEARCHES -> GENERATES -> AUTO-POSTS a week
  function body(tl){
    // 1. name lifts to the Vera chip
    tl.to('#title',{y:-150,opacity:0,duration:.65,ease:'power2.inOut'})
      .fromTo('#core',{y:22,opacity:0,scale:.95},{y:0,opacity:1,scale:1,duration:.6,ease:'back.out(1.4)',immediateRender:false},'-=0.35');
    // 2. the spark (her engine) appears
    tl.fromTo('#spark',{opacity:0,scale:.4},{opacity:1,scale:1,duration:.5,ease:'power3.out',immediateRender:false},'-=0.05');

    // 3. RESEARCHING: she pulls from sources, which flow UP into the spark
    tl.to('#status',{opacity:1,duration:.3},'-=0.05');
    tl.to('#status',{scrambleText:{text:'Researching',chars:'upperCase',speed:.8},duration:.5,ease:'none'},'<');
    RESEARCH.forEach(function(r,i){
      tl.fromTo(r.box,{opacity:0,scale:.85},{opacity:1,scale:1,duration:.35,ease:'power3.out',immediateRender:false}, i===0?'-=0.1':'-=0.22');
      tl.to(r.lab,{scrambleText:{text:'{original}',chars:'upperCase',speed:.8},duration:.35,ease:'none'},'<');
    });
    // hold + pulse while she researches (white status pulses, spark breathes)
    tl.to('#status',{opacity:.4,duration:.55,repeat:3,yoyo:true,ease:'sine.inOut'},'+=0.15');
    tl.to('#spark',{scale:1.06,duration:.55,repeat:3,yoyo:true,ease:'sine.inOut'},'<');
    tl.set('#status',{opacity:1});
    // hold so the research pills (Trends / Audience / Past wins / SEO) read clearly
    tl.to({},{duration:2.0});
    RESEARCH.forEach(function(r,i){
      tl.to(r.box,{x:r.dx,y:r.dy,scale:.15,opacity:0,duration:.5,ease:'power2.in'}, i===0?'+=0':'-=0.4');
    });
    tl.fromTo('#sparkring',{opacity:.6,scale:1},{opacity:0,scale:2.3,duration:.85,ease:'power2.out',immediateRender:false},'-=0.4');

    // 4. GENERATING: the spark turns research into content
    tl.to('#status',{scrambleText:{text:'Generating',chars:'upperCase',speed:.8},duration:.5,ease:'none'},'-=0.2');
    tl.to('#spark',{scale:1.13,duration:.3,ease:'power2.out'},'<').to('#spark',{scale:1,duration:.5,ease:'power2.out'});
    tl.to({},{duration:.4});

    // 5. AUTO-POSTING: the week fills with the generated pieces
    tl.to('#status',{scrambleText:{text:'Auto-posting',chars:'upperCase',speed:.8},duration:.5,ease:'none'},'-=0.1');
    DAYS.forEach(function(d,i){
      tl.to(d.slot,{opacity:1,duration:.4,ease:'power2.out'}, i===0?'-=0.25':'-=0.34');
      tl.to(d.lab,{opacity:1,duration:.3},'<');
      tl.to(d.lab,{scrambleText:{text:'{original}',chars:'upperCase',speed:.8},duration:.4,ease:'none'},'<');
    });
    TILES.forEach(function(t,i){
      var p = i===0 ? '+=0.1' : '-=0.34';
      tl.to(t.fan,{drawSVG:'100%',duration:.35,ease:'power2.out'},p);
      tl.fromTo(t.box,{x:t.fx,y:t.fy,scale:.2,opacity:0},{x:0,y:0,scale:1,opacity:1,duration:.55,ease:'power2.out',immediateRender:false},'<');
      tl.to(t.lab,{scrambleText:{text:'{original}',chars:'upperCase',speed:.8},duration:.4,ease:'none'},'<+0.18');
    });
    // 6. headline decodes in, then hold
    tl.to('#hl',{opacity:1,duration:.3},'+=0.15')
      .fromTo('#hltag',{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:'power3.out',immediateRender:false},'<');
    decodeAll(tl,'#hl1',ORIG[AWAY.indexOf('#hl1')],1.0,'<');
    decodeAll(tl,'#hl2',ORIG[AWAY.indexOf('#hl2')],1.0,'<+0.18');
    tl.to({},{duration:5.5});
  }

  /* ---- start state ---- */
  function setStart(tl){
    tl.set('#content',{opacity:1},0);
    tl.set('#sweep',{top:90,opacity:0},0);
    tl.set('#title',{y:0,opacity:1},0);
    tl.set('#heroname',{opacity:0,color:'#E07A50'},0);
    tl.set('#herosub',{opacity:0},0);
    tl.set('#core',{opacity:0,y:0,scale:1},0);
    tl.set('#spark',{opacity:0,scale:.4},0);
    tl.set('#sparkring',{opacity:0,scale:1},0);
    tl.set('#status',{opacity:0},0);
    RESEARCH.forEach(function(r){ tl.set(r.box,{opacity:0,scale:.85,x:0,y:0},0); });
    DAYS.forEach(function(d){ tl.set(d.lab,{opacity:0},0); tl.set(d.slot,{opacity:0},0); });
    TILES.forEach(function(t){ tl.set(t.box,{opacity:0,scale:.2,x:0,y:0},0); tl.set(t.fan,{drawSVG:'0%'},0); });
    tl.set('#hl',{opacity:0},0);
    tl.set('#hltag',{opacity:0,y:10},0);
    tl.set(['#hl1','#hl2'],{opacity:1},0);
    AWAY.forEach(function(s,i){ tl.set(s,{text:ORIG[i]},0); });
  }

  function build(){
    var tl=gsap.timeline();
    setStart(tl); revealIn(tl); body(tl); clearOut(tl);
    return tl;
  }
  var master=build();
  master.repeat(-1).repeatDelay(0.35);
  window.__MARIA__={ tl:master, cycle:master.duration() };
  master.play(0);
})();
</script>
</body>
</html>
